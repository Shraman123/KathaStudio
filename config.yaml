# Katha Studio configuration. Secrets never go here; they live in .env.
# Every value can be overridden at runtime from CLI flags where one exists.

defaults:
  culture: "Bengali, West Bengal"
  lang: en                 # en | hi | bn: the language of the final spoken script

llm:
  provider: gemini         # gemini | claude  (overridden by --llm)
  gemini_model: gemini-3.8-flash
  # Free tier for gemini-3.8-flash is only 20 requests/day (seen in a 429 on 2026-09-26).
  # When a model's daily quota runs out, the pipeline moves to the next model in this list.
  gemini_fallback_models: [gemini-3.1-flash-lite]
  claude_model: claude-opus-5
  temperature: 0.7
  max_chunk_words: 2500    # the ingest stage splits stories into chunks of about this size

tts:
  model: gemini-3.8-flash-tts          # or gemini-3.8-flash-lite-tts
  voice_mode: designed                 # designed: one call per turn, custom voices
                                       # prebuilt: chunks of up to 2 speakers, prebuilt voices only
  narrator_prebuilt_voice: Charon      # fallback voice when design is unavailable
  sample_rate: 24000

rate_limit:
  requests_per_minute: 10    # conservative guess; check your real limit at aistudio.google.com/rate-limit
  max_retries: 6
  backoff_base_seconds: 2.0
  backoff_max_seconds: 60.0

stitch:
  pause_between_lines_ms: 300
  pause_between_scenes_ms: 1000
  target_dbfs: -16.0
  mp3_bitrate: 192k

# USD per 1M tokens. Source: ai.google.dev/gemini-api/docs/pricing (checked 2026-09-26).
# These prices apply through 2026-12-31; prices double from 2027-01-01.
pricing:
  audio_tokens_per_second: 25
  models:
    gemini-3.8-flash-tts:      {input: 0.50, output: 9.00}
    gemini-3.8-flash-lite-tts: {input: 0.50, output: 6.00}
    gemini-3.8-flash:          {input: 0.75, output: 3.75}
  free_tier: true            # set to false if billing is enabled on your key
  # Free-tier requests/day. Only numbers we have actually observed; the docs don't publish them.
  # Both come from 429 error messages seen on 2026-09-26.
  free_tier_rpd:
    gemini-3.8-flash: 20
    gemini-3.8-flash-tts: 10   # 429 text said "10 requests per day on Free Tier" (12 got through that day)

estimate:
  words_per_minute: {en: 150, hi: 140, bn: 130}   # speaking rate used by --dry-run

paths:
  runs_dir: runs
